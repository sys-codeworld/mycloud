name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Lets you trigger a build manually with a button click

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 4. Make gradlew executable
        run: chmod +x ./gradlew

      - name: 5. Compile Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 6. Upload APK to Action Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Installable-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
